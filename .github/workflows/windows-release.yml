name: Windows 11 Production Release Build & Verification

on:
  push:
    branches: [ "main", "master", "v0.3.x" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================================================================
  # JOB 1: Build Targets, Run In-Tree Regression Tests & Assemble Packages
  # =========================================================================
  build-and-package-x64:
    name: Build & In-Tree Verification (Windows x64)
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Resolve and Validate Release Version
        id: version
        shell: powershell
        run: |
          $rawRef = "${{ github.ref_name }}"
          $refType = "${{ github.ref_type }}"
          Write-Host "Triggered by ${refType} - '$rawRef'"

          # 1. Resolve canonical version
          if ($refType -eq "tag" -or $rawRef -match '^v?\d+\.\d+\.\d+') {
            if ($rawRef -match '^v?(\d+\.\d+\.\d+.*)$') {
              $ver = $Matches[1]
            } else {
              throw "Invalid version tag format: '$rawRef'. Expected semantic version like 'v0.3.1' or '0.3.1'."
            }
          } else {
            $cmakePath = "CMakeLists.txt"
            $ver = "0.3.1"
            if (Test-Path $cmakePath) {
              $cmakeContent = Get-Content $cmakePath -Raw
              if ($cmakeContent -match 'project\s*\(\s*(?:Radium|Flux)\s+VERSION\s+(\d+\.\d+\.\d+)') {
                $ver = $Matches[1]
              }
            }
            Write-Host "Non-tag build on branch '$rawRef'; using repository base version: $ver"
          }

          if ($ver -notmatch '^\d+\.\d+\.\d+([.-].+)?$') {
            throw "Resolved version '$ver' is not valid SemVer (e.g. 0.3.1, 0.3.1-beta.1)"
          }

          Write-Host "Canonical release version: $ver"
          "RADIUM_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FLUX_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Preflight Toolchain & CMake Inspection
        shell: powershell
        run: |
          Write-Host "=== CMake Version ==="
          cmake --version
          Write-Host "`n=== MSVC Compiler (cl.exe) ==="
          Get-Command cl.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          cmd.exe /c "cl 2>&1" | Select-Object -First 1

      - name: Configure CMake
        shell: powershell
        run: |
          Write-Host "Active VisualStudioVersion: $env:VisualStudioVersion, VSINSTALLDIR: $env:VSINSTALLDIR"
          $helpText = (cmake --help | Out-String)
          $candidates = @()
          if ($env:VisualStudioVersion -like "18*" -or $env:VSINSTALLDIR -like "*\18\*") {
              $candidates += 'Visual Studio 18 2026'
          } elseif ($env:VisualStudioVersion -like "17*" -or $env:VSINSTALLDIR -like "*2022*") {
              $candidates += 'Visual Studio 17 2022'
          }
          if ($helpText -match '\*\s+(Visual Studio [^\r\n=]+?)\s*=') {
              $candidates += $Matches[1].Trim()
          }
          $candidates += @('Visual Studio 17 2022', '')

          $configured = $false
          foreach ($gen in ($candidates | Select-Object -Unique)) {
              Write-Host "Attempting CMake configuration with generator: '$gen'..."
              Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
              if ($gen -eq '') {
                  cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release
              } else {
                  cmake -B build -G "$gen" -A x64 -DCMAKE_BUILD_TYPE=Release
              }
              if ($LASTEXITCODE -eq 0) {
                  $configured = $true
                  Write-Host "Successfully configured CMake with generator: '$gen'"
                  break
              }
          }
          if (-not $configured) {
              throw "CMake configuration failed for all candidate generators."
          }

      - name: Build Windows Targets
        run: |
          cmake --build build --config Release --target radium radium-nmh radium_unit_tests openidm openidm-nmh openidm_unit_tests N_m3u8DL-RE

      - name: Provision Upstream Stream Workers (N_m3u8DL-RE & FFmpeg)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/fetch-workers.ps1 -TargetDir tools/win-x64

      - name: Audit Stream Workers and FFmpeg Capabilities
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/verify-ffmpeg-capabilities.ps1 -RunSmokeTests
          $ffPath = "tools/win-x64/ffmpeg.exe"
          $nmPath = "tools/win-x64/N_m3u8DL-RE.exe"
          $ytPath = "tools/win-x64/yt-dlp.exe"
          Write-Host "`n=== Stream Worker Verification Audit ==="
          foreach ($p in @($ffPath, $nmPath, $ytPath)) {
            if (-not (Test-Path $p)) { throw "Required worker missing: $p" }
            $item = Get-Item $p
            $hash = (Get-FileHash $p -Algorithm SHA256).Hash
            Write-Host "$($item.Name): $($item.Length) bytes ($([Math]::Round($item.Length/1MB, 2)) MB) [SHA256: $hash]"
          }
          if ((Get-Item $ffPath).Length -gt 25MB) {
            throw "FFmpeg exceeds 25 MB minimal budget! Monolithic upstream build detected."
          }
          if ((Get-Item $nmPath).Length -gt 5MB) {
            throw "N_m3u8DL-RE exceeds 5 MB native worker budget! Upstream .NET build detected."
          }

      - name: Verify PE32+ Binaries & Subsystems
        shell: powershell
        run: |
          $bins = @(
            @{ Path = "build/Release/radium.exe"; ExpectedSubsystem = 2 },
            @{ Path = "build/Release/radium-nmh.exe"; ExpectedSubsystem = 3 },
            @{ Path = "build/Release/radium_unit_tests.exe"; ExpectedSubsystem = 3 }
          )
          foreach ($b in $bins) {
            if (-not (Test-Path $b.Path)) {
              throw "Binary missing: $($b.Path)"
            }
            $bytes = [System.IO.File]::ReadAllBytes($b.Path)
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              throw "Invalid MZ header: $($b.Path)"
            }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0x8664) {
              throw "Expected AMD64 (0x8664) machine type: $($b.Path)"
            }
            $optOffset = $peOffset + 24
            $magic = [BitConverter]::ToUInt16($bytes, $optOffset)
            if ($magic -ne 0x20B) {
              throw "Expected PE32+ (0x20B) magic: $($b.Path)"
            }
            $subsystem = [BitConverter]::ToUInt16($bytes, $optOffset + 68)
            if ($subsystem -ne $b.ExpectedSubsystem) {
              throw "Expected subsystem $($b.ExpectedSubsystem), got $subsystem for $($b.Path)"
            }
            Write-Host "Verified $($b.Path): AMD64 PE32+ Subsystem=$subsystem"
          }

      - name: Run C++ Unit & Regression Tests
        shell: powershell
        run: |
          .\build\Release\radium_unit_tests.exe

      - name: Run Browser Extension Detection Tests
        shell: powershell
        run: |
          node tests/test_extension_detection.js

      - name: Run End-to-End Integration & Benchmark Suite
        shell: powershell
        run: |
          python tests/run_all_integration_tests.py

      - name: Run Automated Performance Benchmarks
        shell: powershell
        run: |
          python scripts/run-benchmarks.py

      - name: Compile Inno Setup Installers (Full & Core)
        shell: powershell
        run: |
          $issPath = "installer/radium.iss"
          if (-not (Test-Path $issPath)) {
            $issPath = "installer/radium.iss"
          }
          $isccExe = $null
          $isccCandidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          foreach ($cand in $isccCandidates) {
            if (Test-Path $cand) { $isccExe = $cand; break }
          }
          if (-not $isccExe) {
            choco install innosetup -y
            $isccExe = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }

          Write-Host "Compiling Full Offline Installer..."
          & $isccExe "/DMyAppVersion=$env:RADIUM_VERSION" $issPath
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed for Full installer!" }

          Write-Host "`nCompiling Core-Only Installer..."
          & $isccExe "/DMyAppVersion=$env:RADIUM_VERSION" "/DCoreOnly" $issPath
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed for Core installer!" }

      - name: Package Standalone Portable Releases (Full & Core)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/package-release-zip.ps1 -Version "$env:RADIUM_VERSION" -PackageType Both -BuildDir "build/Release"
          Write-Host "`n=== Final SHA-256 Release Checksums ==="
          Get-Content "dist/SHA256SUMS.txt"

      - name: Packaging Size Budget Audit & Verification
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/report-package-sizes.ps1 -Version "$env:RADIUM_VERSION" -DistDir "dist" -UpdateMetrics -FailOnExceeded

      - name: Security & Distribution Integrity Audit
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/verify-release-security.ps1 -DistDir "dist" -ToolsDir "tools/win-x64"

      - name: Upload Release Distribution Packages
        uses: actions/upload-artifact@v4
        with:
          name: radium-dist-windows-x64
          path: dist/

      - name: Upload Build Evidence & Benchmark Reports
        uses: actions/upload-artifact@v4
        with:
          name: radium-evidence-windows-x64
          path: |
            benchmarks/latest_metrics.json
            docs/BENCHMARK_REPORT.md
            build/benchmark_results.json

  # =========================================================================
  # JOB 2: Clean Installation Smoke Tests on Fresh Runner
  # =========================================================================
  clean-install-smoke-test-x64:
    name: Clean Installation Smoke Test (Fresh Runner)
    needs: [build-and-package-x64]
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright & Dependencies
        shell: powershell
        run: |
          npm install
          npx playwright install chromium

      - name: Download Staged Release Packages
        uses: actions/download-artifact@v4
        with:
          name: radium-dist-windows-x64
          path: dist

      - name: Verify Downloaded Installer Assets
        shell: powershell
        run: |
          Write-Host "=== Staged Release Packages for Clean Install Test ==="
          Get-ChildItem -Recurse -Path dist
          $installer = Get-ChildItem -Recurse -Path dist -Filter "Radium-Setup-x64-*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Downloaded release artifacts do not contain a valid Radium setup installer!"
          }
          Write-Host "Found installer: $($installer.FullName)"

      - name: Execute Clean Installation Smoke Suite
        shell: powershell
        run: |
          python tests/test_installer_smoke.py --dist-dir dist

      - name: Upload Installation Test Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installation-smoke-logs
          path: |
            ${{ runner.temp }}/radium_install_*.log
            ${{ runner.temp }}/radium_smoke_*/**
          if-no-files-found: ignore

  # =========================================================================
  # JOB 3: Browser Extension Runtime Tests (Playwright + Chromium)
  # =========================================================================
  browser-extension-runtime-test:
    name: Browser Extension Runtime Test (Chromium)
    needs: [build-and-package-x64]
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright & Dependencies
        run: |
          npm install
          npx playwright install chromium

      - name: Execute Browser Extension Runtime Playwright Tests
        run: |
          node tests/browser/test_extension_runtime.js

      - name: Upload Browser Test Evidence & Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-extension-test-evidence
          path: |
            test-results/browser-extension/
          if-no-files-found: ignore


  # =========================================================================
  # JOB 2: Build Native ARM64 Targets & Assemble Release Packages
  # Compiles genuine native ARM64 binaries (0xAA64) on Windows 11 ARM
  # =========================================================================
  build-and-package-arm64:
    name: Build & In-Tree Verification (Native Windows ARM64)
    runs-on: windows-11-arm
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Python Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip

      - name: Resolve and Validate Release Version
        id: version
        shell: powershell
        run: |
          $rawRef = "${{ github.ref_name }}"
          $refType = "${{ github.ref_type }}"
          Write-Host "Triggered by ${refType} - '$rawRef'"

          if ($refType -eq "tag" -or $rawRef -match '^v?\d+\.\d+\.\d+') {
            if ($rawRef -match '^v?(\d+\.\d+\.\d+.*)$') {
              $ver = $Matches[1]
            } else {
              throw "Invalid version tag format: '$rawRef'."
            }
          } else {
            $cmakePath = "CMakeLists.txt"
            $ver = "0.3.2"
            if (Test-Path $cmakePath) {
              $cmakeContent = Get-Content $cmakePath -Raw
              if ($cmakeContent -match 'project\s*\(\s*(?:Radium|Flux)\s+VERSION\s+(\d+\.\d+\.\d+)') {
                $ver = $Matches[1]
              }
            }
          }
          Write-Host "Canonical ARM64 release version: $ver"
          "RADIUM_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Configure CMake for Native ARM64
        shell: powershell
        run: |
          $generators = @(
              'Visual Studio 18 2026',
              'Visual Studio 17 2022',
              'Ninja',
              ''
          )
          $configured = $false
          foreach ($gen in $generators) {
              Write-Host "Trying CMake generator: '$gen' for ARM64..."
              if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
              if ($gen -eq '') {
                  cmake -B build -A ARM64 -DCMAKE_BUILD_TYPE=Release
              } elseif ($gen -eq 'Ninja') {
                  cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
              } else {
                  cmake -B build -G "$gen" -A ARM64 -DCMAKE_BUILD_TYPE=Release
              }
              if ($LASTEXITCODE -eq 0) {
                  $configured = $true
                  Write-Host "Successfully configured CMake with generator: '$gen'"
                  break
              }
          }
          if (-not $configured) {
              throw "CMake configuration failed for all candidate generators on ARM64."
          }

      - name: Build Native ARM64 Targets
        run: |
          cmake --build build --config Release --target radium radium-nmh radium_unit_tests openidm openidm-nmh openidm_unit_tests N_m3u8DL-RE

      - name: Provision Upstream Stream Workers
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/fetch-workers.ps1 -TargetDir tools/win-x64 -Architecture ARM64

      - name: Verify PE32+ ARM64 (0xAA64) Executable Headers
        shell: powershell
        run: |
          $bins = @(
            @{ Path = "build/Release/radium.exe"; ExpectedSubsystem = 2 },
            @{ Path = "build/Release/radium-nmh.exe"; ExpectedSubsystem = 3 },
            @{ Path = "build/Release/radium_unit_tests.exe"; ExpectedSubsystem = 3 },
            @{ Path = "build/Release/N_m3u8DL-RE.exe"; ExpectedSubsystem = 3 }
          )
          foreach ($b in $bins) {
            if (-not (Test-Path $b.Path)) { throw "Expected ARM64 binary missing: $($b.Path)" }
            $bytes = [System.IO.File]::ReadAllBytes($b.Path)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0xAA64) {
              throw "Verification FAILED: $($b.Path) is not native ARM64 (0xAA64); machine=0x$($machine.ToString('X4'))"
            }
            $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 92)
            if ($subsystem -ne $b.ExpectedSubsystem) {
              throw "Verification FAILED: $($b.Path) subsystem mismatch (expected $($b.ExpectedSubsystem), got $subsystem)"
            }
            Write-Host "Verified Genuine Native ARM64 PE32+ Binary: $($b.Path) [Subsystem=$subsystem]" -ForegroundColor Green
          }

      - name: Run C++ Unit & Regression Tests (Native ARM64 Execution)
        shell: powershell
        run: |
          .\build\Release\radium_unit_tests.exe

      - name: Compile Inno Setup Installers (ARM64 Full & Core)
        shell: powershell
        run: |
          $issPath = "installer/radium.iss"
          $isccExe = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccExe)) {
            choco install innosetup -y
          }
          Write-Host "Compiling Native ARM64 Full Installer..."
          & $isccExe "/DMyAppVersion=$env:RADIUM_VERSION" "/DTargetArch=ARM64" $issPath
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed for ARM64 Full installer!" }

          Write-Host "`nCompiling Native ARM64 Core-Only Installer..."
          & $isccExe "/DMyAppVersion=$env:RADIUM_VERSION" "/DTargetArch=ARM64" "/DCoreOnly" $issPath
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed for ARM64 Core installer!" }

      - name: Package Standalone Portable Releases (ARM64 Full & Core)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/package-release-zip.ps1 -Version "$env:RADIUM_VERSION" -Architecture ARM64 -PackageType Both -BuildDir "build/Release"
          Write-Host "`n=== Final SHA-256 Release Checksums (ARM64) ==="
          Get-Content "dist/SHA256SUMS.txt"

      - name: Security & Distribution Integrity Audit (ARM64)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/verify-release-security.ps1 -DistDir "dist" -ToolsDir "tools/win-x64" -Architecture ARM64

      - name: Upload Release Distribution Packages (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: radium-dist-windows-arm64
          path: dist/

  # =========================================================================
  # JOB 3: Clean Installation Smoke Tests on Native Windows 11 ARM Runner
  # =========================================================================
  clean-install-smoke-test-arm64:
    name: Clean Installation Smoke Test (Windows 11 ARM64)
    needs: [build-and-package-arm64]
    runs-on: windows-11-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright & Dependencies
        shell: powershell
        run: |
          npm install
          npx playwright install chromium

      - name: Download Staged Release Packages (ARM64)
        uses: actions/download-artifact@v4
        with:
          name: radium-dist-windows-arm64
          path: dist

      - name: Verify Downloaded ARM64 Installer Assets
        shell: powershell
        run: |
          Write-Host "=== Staged Release Packages for ARM64 Clean Install Test ==="
          Get-ChildItem -Recurse -Path dist
          $installer = Get-ChildItem -Recurse -Path dist -Filter "Radium-Setup-ARM64-*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Downloaded release artifacts do not contain a valid Radium ARM64 setup installer!"
          }
          Write-Host "Found ARM64 installer: $($installer.FullName)"

      - name: Execute Clean Installation Smoke Suite (ARM64)
        shell: powershell
        run: |
          python tests/test_installer_smoke.py --dist-dir dist --arch ARM64

      - name: Upload Installation Test Logs (ARM64)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installation-smoke-logs-arm64
          path: |
            ${{ runner.temp }}/radium_install_*.log
            ${{ runner.temp }}/radium_smoke_*/**
          if-no-files-found: ignore

  # =========================================================================
  # JOB 4: Publish Official GitHub Release (Guarded by Validation)
  # =========================================================================
  publish-release:
    name: Publish Official GitHub Release (x64 & ARM64)
    needs: [build-and-package-x64, clean-install-smoke-test-x64, browser-extension-runtime-test, build-and-package-arm64, clean-install-smoke-test-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download Staged x64 Release Packages
        uses: actions/download-artifact@v4
        with:
          name: radium-dist-windows-x64
          path: dist

      - name: Download Staged ARM64 Release Packages
        uses: actions/download-artifact@v4
        with:
          name: radium-dist-windows-arm64
          path: dist

      - name: Generate Consolidated SHA256SUMS.txt for All Release Assets
        shell: powershell
        run: |
          $ver = "${{ needs.build-and-package-x64.outputs.version }}"
          Write-Host "Generating Authoritative Multi-Architecture SHA256SUMS for Radium v$ver..."
          $distFiles = Get-ChildItem -Path dist -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" }
          $entries = @()
          foreach ($f in $distFiles) {
            $h = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash
            $entries += "$h  dist\$($f.Name)"
            Write-Host "  $h  dist\$($f.Name)"
          }
          $entries | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding utf8
          Write-Host "`n=== Consolidated SHA256SUMS.txt ==="
          Get-Content "dist/SHA256SUMS.txt"

      - name: Verify Release Assets Before Publishing
        shell: powershell
        run: |
          $ver = "${{ needs.build-and-package-x64.outputs.version }}"
          Write-Host "Publishing Verified GitHub Release for Radium v$ver (x64 + ARM64)..."
          Get-ChildItem -Recurse -Path dist
          $expectedPatterns = @(
            "Radium-Setup-x64-*.exe",
            "Radium-Setup-ARM64-*.exe",
            "Radium-v*-Windows-x64-Full.zip",
            "Radium-v*-Windows-x64-Core.zip",
            "Radium-v*-Windows-ARM64-Full.zip",
            "Radium-v*-Windows-ARM64-Core.zip",
            "SHA256SUMS.txt"
          )
          foreach ($p in $expectedPatterns) {
            $f = Get-ChildItem -Recurse -Path dist -Filter $p | Select-Object -First 1
            if (-not $f) {
              throw "Release validation failed: Required artifact missing matching '$p'"
            }
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash
            Write-Host "Verified asset: $($f.Name) [SHA256: $hash]"
          }

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Radium Download Manager ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/**/Radium-Setup-x64-*.exe
