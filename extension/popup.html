<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Radium Media &amp; Download Capture</title>
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 612 612" fill="none">
          <rect width="612" height="612" rx="120" fill="#0D0F14"/>
          <g>
            <polygon fill="#FF4757" points="88.73,42.78 189.68,42.78 306,159.1 422.32,42.78 422.32,68.02 306,184.34 189.68,68.02 149.08,68.02 306,224.94 306,260.06"/>
            <polygon fill="#F2F6FA" points="422.32,42.78 523.27,42.78 306,260.06 306,224.94 462.92,68.02 422.32,68.02"/>
            <polygon fill="#FF4757" points="88.73,202.36 189.68,202.36 306,318.68 422.32,202.36 422.32,227.6 306,343.92 189.68,227.6 149.08,227.6 306,384.52 306,419.64"/>
            <polygon fill="#F2F6FA" points="422.32,202.36 523.27,202.36 306,419.64 306,384.52 462.92,227.6 422.32,227.6"/>
            <polygon fill="#FF4757" points="88.73,361.94 189.68,361.94 306,478.26 422.32,361.94 422.32,387.18 306,503.5 189.68,387.18 149.08,387.18 306,544.1 306,579.22"/>
            <polygon fill="#F2F6FA" points="422.32,361.94 523.27,361.94 306,579.22 306,544.1 462.92,387.18 422.32,387.18"/>
          </g>
        </svg>
      </span>
      <div class="brand-text">
        <h1>Radium Capture</h1>
        <span id="connectionBadge" class="conn-badge conn-disconnected">Checking Desktop...</span>
      </div>
    </div>
    <label class="toggle" title="Enable automatic download &amp; media capture on this site (Hold Alt when clicking links to bypass)">
      <input type="checkbox" id="siteToggle" checked>
      <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
      <span class="toggle-label">Capture on site</span>
    </label>
  </header>

  <section class="toolbar" aria-label="Media Filter Controls">
    <div class="filter-tabs" role="tablist" aria-label="Filter media categories">
      <button type="button" class="tab-btn active" id="tab-all" data-filter="all" role="tab" aria-selected="true" aria-controls="mediaList" tabindex="0">
        <span>All</span>
        <span id="countAll" class="tab-count">0</span>
      </button>
      <button type="button" class="tab-btn" id="tab-stream" data-filter="stream" role="tab" aria-selected="false" aria-controls="mediaList" tabindex="-1">
        <span>Streams (HLS/DASH)</span>
        <span id="countStream" class="tab-count">0</span>
      </button>
      <button type="button" class="tab-btn" id="tab-direct" data-filter="direct" role="tab" aria-selected="false" aria-controls="mediaList" tabindex="-1">
        <span>Direct Files</span>
        <span id="countDirect" class="tab-count">0</span>
      </button>
      <button type="button" class="tab-btn" id="tab-links" data-filter="links" role="tab" aria-selected="false" aria-controls="mediaList" tabindex="-1">
        <span>Page Links</span>
        <span id="countLinks" class="tab-count">0</span>
      </button>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="4.8" stroke="#A4A5AC" stroke-width="1.6"/>
        <path d="M10.6 10.6L14 14" stroke="#A4A5AC" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input type="search" id="searchInput" class="search-input" placeholder="Filter by title, resolution, or format..." aria-label="Search detected media">
    </div>
  </section>

  <main id="mediaList" class="media-list" role="region" aria-live="polite">
    <p class="empty" data-state="empty">No media detected on this tab yet. Play a video or start a download to capture streams.</p>
  </main>

  <footer class="footer">
    <span id="footerSummary" class="footer-summary">0 items</span>
    <div class="footer-actions">
      <button id="clearListBtn" type="button" class="btn-secondary">Clear List</button>
      <button id="batchDownloadBtn" type="button" class="btn-primary">Download All in Radium</button>
    </div>
  </footer>
  <script src="js/popup.js"></script>
</body>
</html>
